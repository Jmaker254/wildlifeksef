; ============================================================
; Willary Wildlife Detector — ESP32-CAM firmware (PlatformIO)
; Framework: ESP-IDF (pure IDF, no Arduino)
;
;   pio run                 build
;   pio run -t upload       flash   (IO0 -> GND, then reset)
;   pio device monitor      serial monitor (115200)
;   pio run -t menuconfig   ESP-IDF menuconfig
; ============================================================

[platformio]
; ESP-IDF sources live in the standard IDF "main" component folder
src_dir = main
default_envs = esp32cam

[env:esp32cam]
platform = espressif32 @ 6.9.0          ; bundles ESP-IDF v5.3.x
board = esp32cam                         ; AI Thinker ESP32-CAM
framework = espidf

; 4 MB flash, single large app partition (matches sdkconfig.defaults)
board_build.flash_size = 4MB
board_build.partitions = partitions_singleapp_large.csv

; esp32-camera is pulled in by main/idf_component.yml (ESP Component Registry)

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed = 460800
; upload_port  = COM5
; monitor_port = COM5
